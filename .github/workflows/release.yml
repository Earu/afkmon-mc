name: release

# Tag a commit `vX.Y.Z+1.21.1` (or run manually) to build both loaders and publish to Modrinth and
# CurseForge. Tags are shared across branches, so every one of them carries its Minecraft version.
# Modrinth goes through Minotaur (configured in the loader build files), CurseForge through mc-publish.
#
# Required repository settings:
#   secrets.MODRINTH_TOKEN: a Modrinth PAT with "create versions" scope
#   secrets.MODRINTH_ID: the Modrinth project id (or slug)
#   secrets.CURSEFORGE_TOKEN, secrets.CURSEFORGE_ID: the CurseForge upload token and project id

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        # Normalized to <base>+<mc version> so Modrinth naming is uniform across branches,
        # whatever suffix the (repo-globally unique) tag carries.
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            raw="${GITHUB_REF_NAME#v}"
            echo "version=${raw%%+*}+1.21.1" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)-dev.${GITHUB_SHA::7}+1.21.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: afkmon-mc ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          make_latest: false
          files: |
            neoforge/build/libs/afk-neoforge-*.jar
            fabric/build/libs/afk-fabric-*.jar

      - name: Publish both loaders to Modrinth
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ secrets.MODRINTH_ID }}
        run: ./gradlew modrinth -Pmod_version=${{ steps.version.outputs.version }}

      - name: Publish NeoForge to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/afk-neoforge-*.jar
          name: afkmon-mc ${{ steps.version.outputs.version }} (NeoForge)
          version: ${{ steps.version.outputs.version }}
          changelog-file: CHANGELOG.md
          version-type: release
          loaders: neoforge
          game-versions: 1.21.1
          dependencies: |
            kotlin-for-forge(required)

      - name: Publish Fabric to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/afk-fabric-*.jar
          name: afkmon-mc ${{ steps.version.outputs.version }} (Fabric)
          version: ${{ steps.version.outputs.version }}
          changelog-file: CHANGELOG.md
          version-type: release
          loaders: fabric
          game-versions: 1.21.1
          dependencies: |
            fabric-api(required)
            fabric-language-kotlin(required)
